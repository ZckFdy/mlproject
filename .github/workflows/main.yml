name: CI/CD MLflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # 🛠️ PERBAIKAN 1: Jalur langsung ke root karena file ada di root repositori
  CSV_URL: "train_pca.csv"
  TARGET_VAR: "Credit_Score"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v3

      # Setup Python 3.12.7
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"
      
      # Check Env Variables
      - name: Check Env
        run: |
          echo "Target CSV: $CSV_URL"

      # Install mlflow dan dependensi pendukung pembentukan image
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow virtualenv

      # 🛠️ PERBAIKAN 2: Jalankan dari root (.) karena file MLproject ada di luar
      - name: Run mlflow project
        run: |
          mlflow run . --env-manager=local 
      
      # 🛠️ PERBAIKAN 3: Ambil run_id terbaru secara aman menggunakan basename
      - name: Get latest MLflow run_id
        run: |
          LATEST_DIR=$(ls -td mlruns/0/*/ | head -n 1)
          RUN_ID=$(basename "$LATEST_DIR")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id didapatkan: $RUN_ID"
          
      # Build Docker Model
      - name: Build Docker Model
        run: |
          mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "cc" 

      # Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Tag the Docker image
      - name: Tag Docker Image
        run: |
          docker tag cc ${{ secrets.DOCKER_HUB_USERNAME }}/cc:latest

      # Push Docker image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/cc:latest
