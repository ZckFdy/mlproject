name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CSV_URL: "MLproject/train_pca.csv"

jobs:
  build:
    runs-on: ubuntu-latest
    # WAJIB DITAMBAHKAN: Memberikan izin token Actions untuk menulis/push ke repo
    permissions:
      contents: write

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v3

      # Setup Python 3.12.7
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"
        
      # Check Env Variables
      - name: Check Env
        run: |
          echo $CSV_URL

      # Install mlflow
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow
        
      # Run as a mlflow project
      - name: Run mlflow project
        run: |
          mlflow run . --env-manager=local 

      # Save models to GitHub Repository
      - name: Save mlruns to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mlruns/
          
          # Menggunakan pengondisian aman agar tidak error jika tidak ada perubahan berkas
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Save mlruns from CI run"
            git push origin main
          else
            echo "Tidak ada perubahan artefak mlruns yang baru."
          fi
