name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CSV_URL: "MLproject/train_pca.csv"

jobs:
  build:
    runs-on: ubuntu-latest
    # 1. WAJIB: Tambahkan permissions token agar GitHub Actions bisa melakukan push
    permissions:
      contents: write

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v3

      # Setup Python 3.12.7
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"
        
      # Check Env Variables
      - name: Check Env
        run: |
          echo $CSV_URL

      # Install mlflow
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow
        
      # Run as a mlflow project
      - name: Run mlflow project
        run: |
          mlflow run . --env-manager=local 

      # Mengonfigurasi Git LFS dan menyimpan seluruh artefak mlruns sekaligus
      - name: Save mlruns with Git LFS to repo
        run: |
          # Menggunakan tanda kutip ganda agar variabel rahasia dibaca sebagai string utuh
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 2. Inisialisasi Git LFS di Virtual Machine Runner
          git lfs install
          
          # 3. SPESIFIK: Daftarkan ekstensi *.pkl ke Git LFS (bukan nama foldernya saja)
          git lfs track "mlruns/**/*.pkl"
          git add .gitattributes
          
          # 4. Tambahkan seluruh folder logs mlruns
          git add mlruns/
          
          # Jalankan pengondisian agar tidak error jika tidak ada perubahan baru
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Save mlruns logs and large model binary using Git LFS"
            git push origin main
          else
            echo "Tidak ada perubahan artefak mlruns yang baru."
          fi
